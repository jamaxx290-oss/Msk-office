# Builds the LibreOffice writer stack headless and runs the DOCX TOC
# page-number tests added for the Manuskripta TOC work.
#
# This repository is a mirror of the LibreOffice core tree; upstream CI runs in
# Gerrit, so this workflow provides the missing build/test validation on GitHub.
#
# First run compiles the writer stack from scratch (roughly 3-5 hours on the
# hosted 4-core runner); later runs are much faster thanks to the ccache cache.

name: sw TOC build and test

on:
  push:
    branches: [master]
    paths:
      - "sw/**"
      - ".github/workflows/sw-toc.yml"
  pull_request:
    paths:
      - "sw/**"
      - ".github/workflows/sw-toc.yml"
  workflow_dispatch:

concurrency:
  group: sw-toc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/Code
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake bison flex libtool pkg-config gperf \
            gawk patch unzip zip xz-utils ccache nasm libarchive-zip-perl \
            python3 python3-dev python3-venv python3-setuptools \
            zlib1g-dev libxml2-dev libxslt1-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libcairo2-dev libglib2.0-dev \
            libexpat1-dev libicu-dev libgpgme-dev uuid-dev

      - name: Prepare ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-lo-sw-toc
          max-size: 2G

      - name: Configure
        run: |
          ./autogen.sh \
            --disable-gui \
            --disable-gstreamer-1-0 \
            --disable-scripting \
            --disable-report-builder \
            --disable-odk \
            --disable-dbus \
            --disable-cups \
            --disable-evolution2 \
            --disable-firebird-sdbc \
            --disable-mariadb-sdbc \
            --disable-postgresql-sdbc \
            --disable-online-update \
            --without-java \
            --without-junit \
            --with-parallelism="$(nproc)" \
            --enable-ccache

      - name: Build and run the TOC tests
        run: |
          make -O \
            CppunitTest_sw_ooxmlexport28 \
            CppunitTest_sw_ooxmlexport11

      - name: Collect test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            workdir/CppunitTest/
            config_host.mk
          if-no-files-found: ignore
          retention-days: 7
